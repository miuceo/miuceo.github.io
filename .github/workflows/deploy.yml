name: Build & deploy Astro site

# Builds and publishes the Astro site to GitHub Pages on every push to main,
# and on manual dispatch.
#
# The deploy job was originally gated to manual dispatch only, back when the
# Astro site was unproven and pushes must not silently replace the live v1
# site. That cutover is done (ARCHITECTURE.md §9 Phase 3) and Pages now
# serves this workflow's artifact, so the gate was only causing confusion —
# a push would build green while the live site kept serving the previous
# deploy. To roll back a bad deploy, revert the commit and push, or re-run
# an older successful run from the Actions tab.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Bridge v1's machine-generated content (already-published post
      # permalinks + feed, written by post-builder.html/the Worker straight
      # to repo root) into the Astro build output. These are copied fresh
      # on every deploy so already-shared /posts/<slug>.html links and
      # /rss.xml keep resolving even though the Astro site serves posts at
      # a different URL shape (/[lang]/posts/<slug>/). Not committed by
      # hand — CLAUDE.md rule 6 — just relocated at build time.
      - run: |
          mkdir -p public/posts public/posts-data
          cp posts/*.html public/posts/ 2>/dev/null || true
          cp posts-data/*.json public/posts-data/ 2>/dev/null || true
          cp posts.json public/posts.json 2>/dev/null || true
          cp rss.xml public/rss.xml 2>/dev/null || true
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
