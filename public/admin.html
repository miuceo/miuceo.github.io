<!DOCTYPE html>
<html lang="uz">
<head>
<style>html:not(.authed) body{ visibility:hidden; }</style>
<script>
const WORKER_URL = 'https://miuceo-worker.ibrokhimovmiu.workers.dev';
/* Telegram's embedded webview blocks the cross-site session cookie, so also
   send the session id (saved at login) as a Bearer token. Harmless no-op in a
   normal browser, where the cookie works and this key is empty. Without it,
   admin.html bounces back to login.html in Telegram — an endless redirect loop. */
function authHeaders(){
  var t = localStorage.getItem('miuceo_session_token');
  return t ? { 'Authorization': 'Bearer ' + t } : {};
}
(async function(){
  try{
    const res = await fetch(`${WORKER_URL}/api/session`, { credentials: 'include', headers: authHeaders() });
    if(!res.ok){ window.location.replace('login.html'); return; }
    document.documentElement.classList.add('authed');
  }catch(e){
    window.location.replace('login.html');
  }
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin panel — miuceo</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .wrap{ max-width:1000px; margin:0 auto; padding:0 32px 100px; }

  .navbar{ display:flex; justify-content:space-between; align-items:center; padding:22px 0; border-bottom:1px solid var(--line); margin-bottom:40px; }
  .brand{ font-weight:800; font-size:20px; letter-spacing:-0.01em; color:var(--neon-green); text-shadow:var(--glow-sm) var(--neon-green); }
  .back-link{ font-size:13px; color:var(--ink-soft); }
  .back-link:hover{ color:var(--neon-cyan); }

  .page-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; }
  .page-header h1{ font-weight:800; font-size:30px; margin:0; }

  .post-row{ background:var(--bg-2); border:1px solid var(--line); border-radius:8px; padding:20px 24px; display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:14px; }
  .post-info h3{ font-size:17px; font-weight:700; margin:0 0 6px; }
  .post-info .meta{ font-size:12px; color:var(--ink-soft); }
  .post-actions{ display:flex; gap:8px; flex-shrink:0; }
  .empty-state{ text-align:center; padding:60px 20px; color:var(--ink-soft); font-style:italic; font-size:15px; }

  #confirmModal{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); align-items:center; justify-content:center; z-index:100; }
  #confirmModal .box{ background:var(--bg-2); border:1px solid var(--line); border-radius:8px; padding:28px; width:min(440px, 90vw); }
  #confirmModal p{ font-size:15px; margin:0 0 20px; }
  #confirmModal .row{ display:flex; gap:10px; justify-content:flex-end; }

  #logModal{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); align-items:center; justify-content:center; z-index:100; }
  #logModal .box{ background:var(--bg-2); border:1px solid var(--line); border-radius:8px; padding:24px; width:min(600px, 90vw); }
  #logModal .log{ font-size:12px; background:var(--bg-3); border-radius:6px; padding:12px; max-height:200px; overflow-y:auto; white-space:pre-wrap; margin-bottom:14px; }

  @media (max-width:640px){
    .wrap{ padding:0 18px 60px; }
    .navbar{ flex-wrap:wrap; gap:10px; }
    .page-header{ flex-wrap:wrap; gap:14px; }
    .page-header h1{ font-size:24px; }
    .post-row{ flex-direction:column; align-items:flex-start; gap:14px; }
    .post-actions{ flex-wrap:wrap; }
  }
</style>
</head>
<body>

<div class="wrap">
  <nav class="navbar">
    <span class="brand">MIUCEO\</span>
    <div style="display:flex; gap:16px; align-items:center;">
      <button class="theme-toggle" id="themeToggle">☀️</button>
      <button class="btn ghost small" id="logoutBtn">Chiqish</button>
      <a href="/uz/" class="back-link">← Bosh sahifaga</a>
    </div>
  </nav>

  <div class="page-header">
    <h1>Postlar</h1>
    <div style="display:flex; gap:10px;">
      <button class="btn ghost" id="refreshBtn">Yangilash</button>
      <!-- The only editor. v1's post-builder.html is gone: it published a
           single language and linked at permalinks that are no longer
           generated. -->
      <a href="/post-builder/" class="btn">+ Yangi post</a>
    </div>
  </div>

  <div id="postsList">
    <div class="empty-state">Yuklanmoqda...</div>
  </div>
</div>

<div id="confirmModal">
  <div class="box">
    <p id="confirmText">Rostdan ham o'chirmoqchimisiz?</p>
    <div class="row">
      <button class="btn ghost small" id="cancelDeleteBtn">Bekor qilish</button>
      <button class="btn danger small" id="confirmDeleteBtn">Ha, o'chirish</button>
    </div>
  </div>
</div>

<div id="logModal">
  <div class="box">
    <div class="log" id="processLog"></div>
    <button class="btn ghost small" id="closeLogBtn">Yopish</button>
  </div>
</div>

<script src="assets/theme.js"></script>
<script>
const SITE_URL = 'https://muhammadjon.me';
let posts = [];
let slugToDelete = null;

function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function formatDate(iso){
  if(!iso) return '';
  return new Date(iso).toLocaleDateString('uz-UZ', { year:'numeric', month:'long', day:'numeric' });
}

/* ---------- WORKER API (holds every secret server-side) ---------- */
async function apiGithubGet(path){
  const res = await fetch(`${WORKER_URL}/api/github/get`, {
    method: 'POST', credentials: 'include',
    headers: { 'Content-Type': 'application/json', ...authHeaders() },
    body: JSON.stringify({ path }),
  });
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || `GET ${path} xato`);
  return data.file;
}
async function apiGithubPut(path, contentStr, message, sha){
  const res = await fetch(`${WORKER_URL}/api/github/put`, {
    method: 'POST', credentials: 'include',
    headers: { 'Content-Type': 'application/json', ...authHeaders() },
    body: JSON.stringify({ path, content: contentStr, message, sha: sha || null }),
  });
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || `PUT ${path} xato`);
  return data;
}
async function apiGithubDelete(path, message, sha){
  const res = await fetch(`${WORKER_URL}/api/github/delete`, {
    method: 'POST', credentials: 'include',
    headers: { 'Content-Type': 'application/json', ...authHeaders() },
    body: JSON.stringify({ path, message, sha }),
  });
  const data = await res.json();
  if(!data.ok && res.status !== 404) throw new Error(data.error || `DELETE ${path} xato`);
}
async function apiTelegramDelete(messageId){
  if(!messageId) return;
  await fetch(`${WORKER_URL}/api/telegram/delete`, {
    method: 'POST', credentials: 'include',
    headers: { 'Content-Type': 'application/json', ...authHeaders() },
    body: JSON.stringify({ messageId }),
  });
}

async function loadPosts(){
  const listEl = document.getElementById('postsList');
  listEl.innerHTML = '<div class="empty-state">Yuklanmoqda...</div>';
  try{
    const file = await apiGithubGet('posts.json');
    posts = file ? JSON.parse(file.content) : [];
    posts.sort((a,b) => new Date(b.updated_at || b.created_at) - new Date(a.updated_at || a.created_at));
    renderPosts();
  }catch(err){
    listEl.innerHTML = `<div class="empty-state">Xatolik: ${escapeHtml(err.message)}</div>`;
  }
}

function renderPosts(){
  const listEl = document.getElementById('postsList');
  if(posts.length === 0){
    listEl.innerHTML = '<div class="empty-state">Hali post yo\'q. "+ Yangi post" tugmasini bosing.</div>';
    return;
  }
  listEl.innerHTML = posts.map(p => `
    <div class="post-row">
      <div class="post-info">
        <h3>${escapeHtml(p.title)}</h3>
        <div class="meta">Yaratildi: ${formatDate(p.created_at)} · Yangilandi: ${formatDate(p.updated_at)}</div>
      </div>
      <div class="post-actions">
        <a href="/post-builder/?edit=${encodeURIComponent(p.slug)}" class="btn ghost small">Tahrirlash</a>
        <a href="/uz/posts/${p.slug}/" target="_blank" class="btn ghost small">Ko'rish</a>
        <button class="btn danger small" data-slug="${p.slug}" data-title="${escapeHtml(p.title)}">O'chirish</button>
      </div>
    </div>
  `).join('');

  listEl.querySelectorAll('button.danger').forEach(btn => {
    btn.addEventListener('click', () => {
      slugToDelete = btn.getAttribute('data-slug');
      document.getElementById('confirmText').textContent = `"${btn.getAttribute('data-title')}" postini butunlay o'chirmoqchimisiz? Bu amalni orqaga qaytarib bo'lmaydi.`;
      document.getElementById('confirmModal').style.display = 'flex';
    });
  });
}

document.getElementById('cancelDeleteBtn').addEventListener('click', () => {
  document.getElementById('confirmModal').style.display = 'none';
  slugToDelete = null;
});

document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
  document.getElementById('confirmModal').style.display = 'none';
  if(!slugToDelete) return;
  const slug = slugToDelete;
  const post = posts.find(p => p.slug === slug);

  document.getElementById('processLog').textContent = '';
  document.getElementById('logModal').style.display = 'flex';
  const log = (m) => { document.getElementById('processLog').textContent += m + '\n'; };

  try{
    log(`"${post.title}" o'chirilmoqda...`);

    const postFile = await apiGithubGet(`posts/${slug}.html`);
    if(postFile){ await apiGithubDelete(`posts/${slug}.html`, `Delete post: ${post.title}`, postFile.sha); log('✓ posts/' + slug + '.html o\'chirildi'); }

    const dataFile = await apiGithubGet(`posts-data/${slug}.json`);
    if(dataFile){ await apiGithubDelete(`posts-data/${slug}.json`, `Delete post data: ${post.title}`, dataFile.sha); log('✓ posts-data/' + slug + '.json o\'chirildi'); }

    // All three languages, not just uz. Astro builds a page per file that
    // exists, so leaving en.md or ru.md behind keeps /en/posts/<slug>/ live
    // after the post was deleted — a page with no way back to it.
    for(const lang of ['uz','en','ru']){
      const path = `src/content/posts/${slug}/${lang}.md`;
      try{
        const mdFile = await apiGithubGet(path);
        if(mdFile){ await apiGithubDelete(path, `Delete ${lang} post content: ${post.title}`, mdFile.sha); log('✓ ' + path + ' o\'chirildi'); }
      }catch(err){
        log('⚠ ' + path + ' o\'chirib bo\'lmadi (' + err.message + ')');
      }
    }

    const indexFile = await apiGithubGet('posts.json');
    let index = indexFile ? JSON.parse(indexFile.content) : [];
    index = index.filter(p => p.slug !== slug);
    await apiGithubPut('posts.json', JSON.stringify(index, null, 2), `Remove post from index: ${post.title}`, indexFile.sha);
    log('✓ posts.json yangilandi');

    if(post.telegram_message_id){
      await apiTelegramDelete(post.telegram_message_id);
      log('✓ Telegram xabari o\'chirildi');
    }

    log('');
    log('Tayyor!');
    posts = posts.filter(p => p.slug !== slug);
    renderPosts();
  }catch(err){
    log('✗ Xatolik: ' + err.message);
  }
  slugToDelete = null;
});

document.getElementById('closeLogBtn').addEventListener('click', () => {
  document.getElementById('logModal').style.display = 'none';
});
document.getElementById('refreshBtn').addEventListener('click', loadPosts);
document.getElementById('logoutBtn').addEventListener('click', async () => {
  try{ await fetch(`${WORKER_URL}/auth/logout`, { method: 'POST', credentials: 'include', headers: authHeaders() });
  localStorage.removeItem('miuceo_session_token'); }catch(e){}
  window.location.href = '/uz/';
});

loadPosts();
</script>
</body>
</html>
