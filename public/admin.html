<!DOCTYPE html>

<style>html:not(.authed) body{ visibility:hidden; }</style>
<script>
const WORKER_URL = 'https://miuceo-worker.ibrokhimovmiu.workers.dev';
/* Telegram's embedded webview blocks the cross-site session cookie, so also
   send the session id (saved at login) as a Bearer token. Harmless no-op in a
   normal browser, where the cookie works and this key is empty. Without it,
   admin.html bounces back to login.html in Telegram — an endless redirect loop. */
function authHeaders(){
  var t = localStorage.getItem('miuceo_session_token');
  return t ? { 'Authorization': 'Bearer ' + t } : {};
}
(async function(){
  try{
    const res = await fetch(`${WORKER_URL}/api/session`, { credentials: 'include', headers: authHeaders() });
    if(!res.ok){ window.location.replace('login.html'); return; }
    document.documentElement.classList.add('authed');
  }catch(e){
    window.location.replace('login.html');
  }
})();
</script>

<script>
const SITE_URL = 'https://muhammadjon.me';
let posts = [];
let slugToDelete = null;
let confirmDeleteMode = 'post'; // 'post' | 'artifact' — which flow confirmDeleteBtn runs
let artifacts = [];
let artifactSlugToDelete = null;

function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function formatDate(iso){
  if(!iso) return '';
  return new Date(iso).toLocaleDateString('uz-UZ', { year:'numeric', month:'long', day:'numeric' });
}

/* ---------- WORKER API (holds every secret server-side) ---------- */
async function apiGithubGet(path){
  const res = await fetch(`${WORKER_URL}/api/github/get`, {
    method: 'POST', credentials: 'include',
    headers: { 'Content-Type': 'application/json', ...authHeaders() },
    body: JSON.stringify({ path }),
  });
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || `GET ${path} xato`);
  return data.file;
}
async function apiGithubPut(path, contentStr, message, sha){
  const res = await fetch(`${WORKER_URL}/api/github/put`, {
    method: 'POST', credentials: 'include',
    headers: { 'Content-Type': 'application/json', ...authHeaders() },
    body: JSON.stringify({ path, content: contentStr, message, sha: sha || null }),
  });
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || `PUT ${path} xato`);
  return data;
}
async function apiGithubDelete(path, message, sha){
  const res = await fetch(`${WORKER_URL}/api/github/delete`, {
    method: 'POST', credentials: 'include',
    headers: { 'Content-Type': 'application/json', ...authHeaders() },
    body: JSON.stringify({ path, message, sha }),
  });
  const data = await res.json();
  if(!data.ok && res.status !== 404) throw new Error(data.error || `DELETE ${path} xato`);
}
async function apiTelegramDelete(messageId){
  if(!messageId) return;
  await fetch(`${WORKER_URL}/api/telegram/delete`, {
    method: 'POST', credentials: 'include',
    headers: { 'Content-Type': 'application/json', ...authHeaders() },
    body: JSON.stringify({ messageId }),
  });
}

async function loadPosts(){
  const listEl = document.getElementById('postsList');
  listEl.innerHTML = '<div class="empty-state">Yuklanmoqda...</div>';
  try{
    const file = await apiGithubGet('posts.json');
    posts = file ? JSON.parse(file.content) : [];
    posts.sort((a,b) => new Date(b.updated_at || b.created_at) - new Date(a.updated_at || a.created_at));
    renderPosts();
  }catch(err){
    listEl.innerHTML = `<div class="empty-state">Xatolik: ${escapeHtml(err.message)}</div>`;
  }
}

function renderPosts(){
  const listEl = document.getElementById('postsList');
  if(posts.length === 0){
    listEl.innerHTML = '<div class="empty-state">Hali post yo\'q. "+ Yangi post" tugmasini bosing.</div>';
    return;
  }
  listEl.innerHTML = posts.map(p => `
    <div class="post-row">
      <div class="post-info">
        <h3>${escapeHtml(p.title)}</h3>
        <div class="meta">Yaratildi: ${formatDate(p.created_at)} · Yangilandi: ${formatDate(p.updated_at)}</div>
      </div>
      <div class="post-actions">
        <a href="/post-builder/?edit=${encodeURIComponent(p.slug)}" class="btn ghost small">Tahrirlash</a>
        <a href="/uz/posts/${p.slug}/" target="_blank" class="btn ghost small">Ko'rish</a>
        <button class="btn danger small" data-slug="${p.slug}" data-title="${escapeHtml(p.title)}">O'chirish</button>
      </div>
    </div>
  `).join('');

  listEl.querySelectorAll('button.danger').forEach(btn => {
    btn.addEventListener('click', () => {
      confirmDeleteMode = 'post';
      slugToDelete = btn.getAttribute('data-slug');
      document.getElementById('confirmText').textContent = `"${btn.getAttribute('data-title')}" postini butunlay o'chirmoqchimisiz? Bu amalni orqaga qaytarib bo'lmaydi.`;
      document.getElementById('confirmModal').style.display = 'flex';
    });
  });
}

document.getElementById('cancelDeleteBtn').addEventListener('click', () => {
  document.getElementById('confirmModal').style.display = 'none';
  slugToDelete = null;
  artifactSlugToDelete = null;
});

document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
  document.getElementById('confirmModal').style.display = 'none';
  if(confirmDeleteMode === 'artifact'){ await runArtifactDelete(); return; }
  if(!slugToDelete) return;
  const slug = slugToDelete;
  const post = posts.find(p => p.slug === slug);

  document.getElementById('processLog').textContent = '';
  document.getElementById('logModal').style.display = 'flex';
  const log = (m) => { document.getElementById('processLog').textContent += m + '\n'; };

  try{
    log(`"${post.title}" o'chirilmoqda...`);

    const postFile = await apiGithubGet(`posts/${slug}.html`);
    if(postFile){ await apiGithubDelete(`posts/${slug}.html`, `Delete post: ${post.title}`, postFile.sha); log('✓ posts/' + slug + '.html o\'chirildi'); }

    const dataFile = await apiGithubGet(`posts-data/${slug}.json`);
    if(dataFile){ await apiGithubDelete(`posts-data/${slug}.json`, `Delete post data: ${post.title}`, dataFile.sha); log('✓ posts-data/' + slug + '.json o\'chirildi'); }

    // All three languages, not just uz. Astro builds a page per file that
    // exists, so leaving en.md or ru.md behind keeps /en/posts/<slug>/ live
    // after the post was deleted — a page with no way back to it.
    for(const lang of ['uz','en','ru']){
      const path = `src/content/posts/${slug}/${lang}.md`;
      try{
        const mdFile = await apiGithubGet(path);
        if(mdFile){ await apiGithubDelete(path, `Delete ${lang} post content: ${post.title}`, mdFile.sha); log('✓ ' + path + ' o\'chirildi'); }
      }catch(err){
        log('⚠ ' + path + ' o\'chirib bo\'lmadi (' + err.message + ')');
      }
    }

    const indexFile = await apiGithubGet('posts.json');
    let index = indexFile ? JSON.parse(indexFile.content) : [];
    index = index.filter(p => p.slug !== slug);
    await apiGithubPut('posts.json', JSON.stringify(index, null, 2), `Remove post from index: ${post.title}`, indexFile.sha);
    log('✓ posts.json yangilandi');

    if(post.telegram_message_id){
      await apiTelegramDelete(post.telegram_message_id);
      log('✓ Telegram xabari o\'chirildi');
    }

    log('');
    log('Tayyor!');
    posts = posts.filter(p => p.slug !== slug);
    renderPosts();
  }catch(err){
    log('✗ Xatolik: ' + err.message);
  }
  slugToDelete = null;
});

document.getElementById('closeLogBtn').addEventListener('click', () => {
  document.getElementById('logModal').style.display = 'none';
});
document.getElementById('refreshBtn').addEventListener('click', loadPosts);
document.getElementById('logoutBtn').addEventListener('click', async () => {
  try{ await fetch(`${WORKER_URL}/auth/logout`, { method: 'POST', credentials: 'include', headers: authHeaders() });
  localStorage.removeItem('miuceo_session_token'); }catch(e){}
  window.location.href = '/uz/';
});

/* ---------- TABS ---------- */
let artifactsLoaded = false;
function switchTab(tab){
  document.getElementById('tabPostsBtn').classList.toggle('active', tab === 'posts');
  document.getElementById('tabArtifactsBtn').classList.toggle('active', tab === 'artifacts');
  document.getElementById('postsPanel').classList.toggle('active', tab === 'posts');
  document.getElementById('artifactsPanel').classList.toggle('active', tab === 'artifacts');
  if(tab === 'artifacts' && !artifactsLoaded){ artifactsLoaded = true; loadArtifacts(); }
}
document.getElementById('tabPostsBtn').addEventListener('click', () => switchTab('posts'));
document.getElementById('tabArtifactsBtn').addEventListener('click', () => switchTab('artifacts'));
document.getElementById('refreshArtifactsBtn').addEventListener('click', loadArtifacts);

/* ---------- ARTIFACTS: WORKER API ---------- */
async function apiArtifactsList(){
  const res = await fetch(`${WORKER_URL}/api/artifacts/list`, {
    method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json', ...authHeaders() },
  });
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || 'Artifacts ro\'yxatini olishda xato');
  return data.artifacts;
}
async function apiArtifactsSave(payload){
  const res = await fetch(`${WORKER_URL}/api/artifacts/save`, {
    method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json', ...authHeaders() },
    body: JSON.stringify(payload),
  });
  return res.json();
}
async function apiArtifactsDelete(slug, htmlSha, metaSha){
  const res = await fetch(`${WORKER_URL}/api/artifacts/delete`, {
    method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json', ...authHeaders() },
    body: JSON.stringify({ slug, htmlSha, metaSha }),
  });
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || 'Artifact o\'chirishda xato');
}

function localizedText(v){
  if(!v) return '';
  if(typeof v === 'string') return v;
  return v.uz || v.en || v.ru || '';
}

async function loadArtifacts(){
  const listEl = document.getElementById('artifactsList');
  listEl.innerHTML = '<div class="empty-state">Yuklanmoqda...</div>';
  try{
    artifacts = await apiArtifactsList();
    artifacts.sort((a,b) => new Date(b.date || 0) - new Date(a.date || 0));
    renderArtifacts();
  }catch(err){
    listEl.innerHTML = `<div class="empty-state">Xatolik: ${escapeHtml(err.message)}</div>`;
  }
}

function renderArtifacts(){
  const listEl = document.getElementById('artifactsList');
  if(artifacts.length === 0){
    listEl.innerHTML = '<div class="empty-state">Hali artifact yo\'q. "+ Yangi artifact" tugmasini bosing.</div>';
    return;
  }
  listEl.innerHTML = artifacts.map(a => `
    <div class="post-row">
      <div class="post-info">
        <h3><span class="model-tag">${escapeHtml(a.model || '')}</span>${escapeHtml(localizedText(a.title))}</h3>
        <div class="meta">Sana: ${formatDate(a.date)}${a.tags && a.tags.length ? ' · ' + a.tags.map(escapeHtml).join(', ') : ''}</div>
      </div>
      <div class="post-actions">
        <a href="/uz/artifacts/${a.slug}/" target="_blank" class="btn ghost small">Ko'rish</a>
        <button class="btn ghost small" data-edit-slug="${a.slug}">Tahrirlash</button>
        <button class="btn danger small" data-delete-slug="${a.slug}" data-title="${escapeHtml(localizedText(a.title))}">O'chirish</button>
      </div>
    </div>
  `).join('');

  listEl.querySelectorAll('button[data-edit-slug]').forEach(btn => {
    btn.addEventListener('click', () => openArtifactModal(btn.getAttribute('data-edit-slug')));
  });
  listEl.querySelectorAll('button[data-delete-slug]').forEach(btn => {
    btn.addEventListener('click', () => {
      confirmDeleteMode = 'artifact';
      artifactSlugToDelete = btn.getAttribute('data-delete-slug');
      document.getElementById('confirmText').textContent = `"${btn.getAttribute('data-title')}" artifaktini butunlay o'chirmoqchimisiz? Bu amalni orqaga qaytarib bo'lmaydi.`;
      document.getElementById('confirmModal').style.display = 'flex';
    });
  });
}

async function runArtifactDelete(){
  if(!artifactSlugToDelete) return;
  const slug = artifactSlugToDelete;
  const artifact = artifacts.find(a => a.slug === slug);
  document.getElementById('processLog').textContent = '';
  document.getElementById('logModal').style.display = 'flex';
  const log = (m) => { document.getElementById('processLog').textContent += m + '\n'; };
  try{
    log(`"${localizedText(artifact && artifact.title)}" o'chirilmoqda...`);
    await apiArtifactsDelete(slug, artifact && artifact.htmlSha, artifact && artifact.metaSha);
    log('✓ Artifact o\'chirildi');
    log('');
    log('Tayyor!');
    artifacts = artifacts.filter(a => a.slug !== slug);
    renderArtifacts();
  }catch(err){
    log('✗ Xatolik: ' + err.message);
  }
  artifactSlugToDelete = null;
}

/* ---------- ARTIFACTS: UPLOAD/EDIT MODAL ---------- */
const ARTIFACT_MAX_BYTES = 2 * 1024 * 1024;
const SECRET_PATTERNS = [
  /sk-[A-Za-z0-9]{10,}/, /AIza[0-9A-Za-z\-_]{10,}/, /ghp_[A-Za-z0-9]{20,}/,
  /gho_[A-Za-z0-9]{20,}/, /github_pat_[A-Za-z0-9_]{20,}/, /Bearer\s+[A-Za-z0-9._\-]{10,}/,
];
function findSecretMatches(html){
  const found = [];
  for(const re of SECRET_PATTERNS){ const m = html.match(re); if(m) found.push(m[0].slice(0,12) + '…'); }
  return found;
}
function slugify(title){
  return title.toLowerCase().trim()
    .replace(/[^a-z0-9\s-]/g, '')
    .replace(/\s+/g, '-')
    .replace(/-+/g, '-')
    .replace(/^-|-$/g, '')
    || 'artifact-' + Date.now();
}

let pendingArtifactHtml = null; // read from file input, held until save
let pendingArtifactForce = false;

function resetArtifactModal(){
  document.getElementById('artifactSlug').value = '';
  document.getElementById('artifactHtmlSha').value = '';
  document.getElementById('artifactMetaSha').value = '';
  document.getElementById('artifactTitle').value = '';
  document.getElementById('artifactModel').value = 'Claude';
  document.getElementById('artifactDescription').value = '';
  document.getElementById('artifactPrompt').value = '';
  document.getElementById('artifactTags').value = '';
  document.getElementById('artifactLicense').value = '';
  document.getElementById('artifactRequiresClaude').checked = false;
  document.getElementById('artifactFile').value = '';
  document.getElementById('artifactFileHint').textContent = '';
  document.getElementById('artifactWarningBox').style.display = 'none';
  document.getElementById('artifactWarningBox').innerHTML = '';
  pendingArtifactHtml = null;
  pendingArtifactForce = false;
}

function openArtifactModal(editSlug){
  resetArtifactModal();
  const isEdit = !!editSlug;
  document.getElementById('artifactModalTitle').textContent = isEdit ? 'Artifactni tahrirlash' : 'Yangi artifact';
  if(isEdit){
    const a = artifacts.find(x => x.slug === editSlug);
    if(!a) return;
    document.getElementById('artifactSlug').value = a.slug;
    document.getElementById('artifactHtmlSha').value = a.htmlSha || '';
    document.getElementById('artifactMetaSha').value = a.metaSha || '';
    document.getElementById('artifactTitle').value = localizedText(a.title);
    document.getElementById('artifactModel').value = a.model || 'Claude';
    document.getElementById('artifactDescription').value = localizedText(a.description);
    document.getElementById('artifactPrompt').value = a.prompt || '';
    document.getElementById('artifactTags').value = (a.tags || []).join(', ');
    document.getElementById('artifactLicense').value = a.license || '';
    document.getElementById('artifactRequiresClaude').checked = !!a.requiresClaude;
    document.getElementById('artifactFileHint').textContent = '(bo\'sh qoldirsangiz, eski HTML fayl saqlanadi)';
  }
  document.getElementById('artifactModal').style.display = 'flex';
}

document.getElementById('newArtifactBtn').addEventListener('click', () => openArtifactModal(null));
document.getElementById('cancelArtifactBtn').addEventListener('click', () => {
  document.getElementById('artifactModal').style.display = 'none';
});

document.getElementById('artifactFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  pendingArtifactHtml = null;
  pendingArtifactForce = false;
  document.getElementById('artifactWarningBox').style.display = 'none';
  if(!file) return;
  if(file.size > ARTIFACT_MAX_BYTES){
    document.getElementById('artifactFileHint').textContent = `Fayl juda katta (${(file.size/1024/1024).toFixed(2)} MB). Eng ko'pi 2 MB.`;
    e.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    pendingArtifactHtml = String(reader.result || '');
    document.getElementById('artifactFileHint').textContent = `${file.name} (${(file.size/1024).toFixed(0)} KB)`;
    const matches = findSecretMatches(pendingArtifactHtml);
    if(matches.length > 0){
      const box = document.getElementById('artifactWarningBox');
      box.style.display = 'block';
      box.innerHTML = `⚠ Faylda tokenga o'xshash qatorlar topildi: ${matches.map(escapeHtml).join(', ')}. Baribir yuklashni xohlaysizmi?`
        + '<div style="margin-top:8px;"><label style="font-weight:500; color:var(--ink); display:flex; gap:6px; align-items:center;">'
        + '<input type="checkbox" id="artifactForceUpload"> Ha, baribir yuklash</label></div>';
      document.getElementById('artifactForceUpload').addEventListener('change', (ev) => {
        pendingArtifactForce = ev.target.checked;
      });
    }
  };
  reader.readAsText(file);
});

document.getElementById('saveArtifactBtn').addEventListener('click', async () => {
  const slugInput = document.getElementById('artifactSlug').value.trim();
  const title = document.getElementById('artifactTitle').value.trim();
  const model = document.getElementById('artifactModel').value;
  const isEdit = !!slugInput;

  if(!title){ alert('Nom kiritish shart.'); return; }
  if(!isEdit && !pendingArtifactHtml){ alert('Yangi artifact uchun HTML fayl tanlang.'); return; }

  const matches = pendingArtifactHtml ? findSecretMatches(pendingArtifactHtml) : [];
  if(matches.length > 0 && !pendingArtifactForce){
    alert('Fayl shubhali qator(lar) bo\'lgani uchun avval ogohlantirish ostidagi katakchani belgilang.');
    return;
  }

  let slug = isEdit ? slugInput : slugify(title);
  if(!isEdit){
    const existingSlugs = new Set(artifacts.map(a => a.slug));
    let candidate = slug, n = 2;
    while(existingSlugs.has(candidate)){ candidate = `${slug}-${n++}`; }
    slug = candidate;
  }
  const tags = document.getElementById('artifactTags').value.split(',').map(t => t.trim()).filter(Boolean);
  const meta = {
    title,
    model,
    description: document.getElementById('artifactDescription').value.trim() || undefined,
    date: isEdit ? (artifacts.find(a => a.slug === slug) || {}).date || new Date().toISOString() : new Date().toISOString(),
    tags,
    prompt: document.getElementById('artifactPrompt').value.trim() || undefined,
    requiresClaude: document.getElementById('artifactRequiresClaude').checked,
    license: document.getElementById('artifactLicense').value.trim() || undefined,
  };

  const btn = document.getElementById('saveArtifactBtn');
  btn.disabled = true; btn.textContent = 'Saqlanmoqda...';
  try{
    const result = await apiArtifactsSave({
      slug,
      html: pendingArtifactHtml,
      meta,
      htmlSha: document.getElementById('artifactHtmlSha').value || null,
      metaSha: document.getElementById('artifactMetaSha').value || null,
      force: pendingArtifactForce,
    });
    if(!result.ok){
      if(result.warning){
        alert('Fayl shubhali qator(lar) bo\'lgani uchun ogohlantirish katakchasini belgilab, qayta saqlang.');
      } else {
        alert('Xatolik: ' + (result.error || 'nomalum'));
      }
      return;
    }
    document.getElementById('artifactModal').style.display = 'none';
    artifactsLoaded = false;
    await loadArtifacts();
    artifactsLoaded = true;
  }catch(err){
    alert('Xatolik: ' + err.message);
  }finally{
    btn.disabled = false; btn.textContent = 'Saqlash';
  }
});

loadPosts();
</script>
</body>
</html>
