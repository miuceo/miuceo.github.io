<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kirish — Muhammadjon Ibrohimov</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="assets/theme.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--space-3);
    background: var(--bg);
  }
  .card {
    background: var(--bg);
    border: 1px solid var(--mid);
    border-radius: var(--radius-card);
    padding: var(--space-5);
    text-align: center;
    width: min(440px, calc(100vw - 32px));
    box-shadow: 0 4px 20px color-mix(in srgb, var(--text) 5%, transparent);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .brand-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: var(--space-4);
  }
  .brand {
    font-family: var(--font-heading);
    font-weight: 600;
    font-size: 18px;
    color: var(--accent-1-text);
  }
  .card h1 {
    font-family: var(--font-heading);
    font-size: 30px;
    font-weight: 600;
    color: var(--text);
    margin: 0 0 10px;
  }
  #cardHint {
    font-family: var(--font-body);
    font-size: 16px;
    font-style: normal;
    color: var(--text);
    margin: 0 0 var(--space-5);
    line-height: 1.55;
    opacity: 0.85;
  }

  #telegramLoginBox {
    display: flex;
    justify-content: center;
    min-height: 44px;
    margin: var(--space-3) 0;
  }

  .status-msg {
    font-size: 13px;
    font-family: var(--font-heading);
    margin-top: var(--space-4);
    padding: 12px 14px;
    display: none;
    border-radius: var(--radius-ui);
    background: var(--surface);
    border-left: 4px solid var(--accent-1);
    text-align: left;
    line-height: 1.45;
  }
  .status-msg.error {
    display: block;
    border-left-color: var(--accent-2);
    color: var(--accent-2);
  }
  .status-msg.ok {
    display: block;
    border-left-color: var(--accent-3);
    color: var(--text);
  }

  .back {
    margin-top: var(--space-4);
  }
  .back a {
    font-family: var(--font-heading);
    font-size: 13px;
    font-weight: 600;
    color: var(--accent-1-text);
    text-decoration: none;
    transition: color 0.2s ease, text-shadow 0.2s ease;
  }
  .back a:hover {
    color: var(--accent-1);
    text-shadow: 0 0 12px color-mix(in srgb, var(--accent-1) 55%, transparent);
  }

  @media (max-width: 480px) {
    .card {
      padding: var(--space-4) var(--space-3);
    }
  }
</style>
</head>
<body>

<div class="card">
  <div class="brand-row">
    <div class="brand">Muhammadjon Ibrohimov</div>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle Theme">☀️</button>
  </div>
  <h1>Admin panel</h1>
  <p id="cardHint">Faqat sayt egasi kira oladi.<br>Telegram orqali tasdiqlang.</p>

  <div id="telegramLoginBox"></div>
  <div id="statusMsg" class="status-msg"></div>

  <div class="back"><a href="/uz/">← Bosh sahifaga qaytish</a></div>
</div>

<script src="assets/theme.js"></script>
<script>
/* Worker haqiqiy tekshiruvni bajaradi — bot token hech qachon brauzerga tushmaydi. */
const WORKER_URL = 'https://miuceo-worker.ibrokhimovmiu.workers.dev';
const TELEGRAM_BOT_USERNAME = 'muhammadjon_me_bot';

/* Telegram's embedded webview blocks the cross-site session cookie, so keep
   the session id here too and send it as a Bearer token from admin.html /
   post-builder.html. Harmless in a normal browser, where the cookie works. */
function saveSessionToken(data){
  if(data && data.sessionId) localStorage.setItem('miuceo_session_token', data.sessionId);
}

function showStatus(msg, isError){
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status-msg ' + (isError ? 'error' : 'ok');
}

function goToAdmin(){
  showStatus('Xush kelibsiz! Admin panelga o\'tilmoqda...', false);
  setTimeout(() => { window.location.href = 'admin.html'; }, 500);
}

/* ---------- TELEGRAM LOGIN WIDGET ---------- */
window.onTelegramAuth = async function(user){
  showStatus('Tekshirilmoqda...', false);
  try{
    const res = await fetch(`${WORKER_URL}/auth/telegram-widget`, {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(user),
    });
    const data = await res.json();
    if(!data.ok){ showStatus(data.error || 'Kirish rad etildi.', true); return; }
    saveSessionToken(data);
    goToAdmin();
  }catch(err){
    showStatus('Tarmoq xatosi: ' + err.message, true);
  }
};

/* ---------- TELEGRAM MINI APP (WebApp) ---------- */
async function tryMiniAppAuth(){
  const tg = window.Telegram && window.Telegram.WebApp;
  if(!tg || !tg.initData){
    return false; // Mini App ichida emasmiz, oddiy vidjetga o'tamiz
  }

  tg.ready();
  if(tg.expand) tg.expand();

  document.getElementById('cardHint').textContent = 'Telegram orqali avtomatik tasdiqlanmoqda...';
  document.getElementById('telegramLoginBox').style.display = 'none';
  showStatus('Tekshirilmoqda...', false);

  try{
    const res = await fetch(`${WORKER_URL}/auth/telegram-miniapp`, {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: tg.initData }),
    });
    const data = await res.json();
    if(!data.ok){ showStatus(data.error || 'Kirish rad etildi.', true); return true; }
    saveSessionToken(data);
    goToAdmin();
  }catch(err){
    showStatus('Tarmoq xatosi: ' + err.message, true);
  }
  return true;
}

/* ---------- RENDER TELEGRAM WIDGET (oddiy brauzer uchun) ---------- */
function renderTelegramWidget(){
  const box = document.getElementById('telegramLoginBox');
  const script = document.createElement('script');
  script.async = true;
  script.src = 'https://telegram.org/js/telegram-widget.js?22';
  script.setAttribute('data-telegram-login', TELEGRAM_BOT_USERNAME);
  script.setAttribute('data-size', 'large');
  script.setAttribute('data-radius', '8');
  script.setAttribute('data-onauth', 'onTelegramAuth(user)');
  script.setAttribute('data-request-access', 'write');
  box.appendChild(script);
}

/* ---------- INIT: avval Mini App, bo'lmasa oddiy vidjet ---------- */
(async function init(){
  const handledByMiniApp = await tryMiniAppAuth();
  if(!handledByMiniApp){
    renderTelegramWidget();
  }
})();
</script>
</body>
</html>
