name = "miuceo-worker"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# No custom route yet — ships on the free *.workers.dev subdomain.
# To move to api.muhammadjon.me later (needs the zone on Cloudflare DNS):
#   [[routes]]
#   pattern = "api.muhammadjon.me/*"
#   custom_domain = true
# and drop the workers.dev default via `workers_dev = false`.

[vars]
# Non-secret config. Secrets (tokens) are set with `wrangler secret put` — see worker/README.md.
SITE_ORIGIN = "https://muhammadjon.me"
GH_OWNER = "miuceo"
GH_REPO = "miuceo.github.io"
GH_BRANCH = "main"
ALLOWED_TELEGRAM_ID = "7197666892"
TG_CHANNEL = "@muhammadibrohimov_ceo"
SESSION_COOKIE_NAME = "miuceo_session"
SESSION_TTL_SECONDS = "2592000"  # 30 days — matches the auth duration v1's reader flow used

# Agent model candidates, tried left to right, Groq first then OpenRouter
# (ARCHITECTURE.md §10 routing table: fast text goes to Groq). Config, never
# code — the free roster rotates and a hardcoded id is a future outage.
#
# Proof that this matters, twice over: §10 originally recommended Groq's
# `meta-llama/llama-4-scout-17b-16e-instruct`, deprecated 2026-06-17; and the
# first OpenRouter pair tried here (`deepseek/deepseek-r1:free`,
# `meta-llama/llama-3.3-70b-instruct:free`) had already vanished from the free
# roster by the time it was written. Every id below was verified live against
# console.groq.com/docs/models and `GET openrouter.ai/api/v1/models` on
# 2026-08-10. Re-verify before each deploy — a dead id costs one config edit.
#
# `openai/gpt-oss-*` is OpenAI's open-weights model served by Groq/OpenRouter —
# the provider is still Groq or OpenRouter, so this is consistent with D13,
# which constrains providers rather than model lineage (exactly as §10 already
# allows `google/gemma-*` via OpenRouter).
#
# Ordering is deliberate: production-grade first, preview/eval-only last, since
# preview models can vanish without notice (same caveat as Groq TTS in §5.1).
GROQ_TEXT_MODELS = "openai/gpt-oss-120b,qwen/qwen3.6-27b"
OPENROUTER_TEXT_MODELS = "nvidia/nemotron-3-super-120b-a12b:free,openai/gpt-oss-20b:free"
# Speech to text (Phase 5 Stage 3). Single value, not a ladder: OpenRouter has
# no equivalent free STT endpoint, so there is nothing to fall back to.
GROQ_STT_MODEL = "whisper-large-v3"

[[d1_databases]]
binding = "DB"
database_name = "miuceo-db"
database_id = "64b70544-9842-4c75-961e-54974a3dd66a"

# Secrets — set via `wrangler secret put <NAME>`, never written here:
#   GH_TOKEN            GitHub PAT, repo-write scope on miuceo/miuceo.github.io
#   TG_BOT_TOKEN        Telegram bot token from @BotFather
#   GROQ_API_KEY        console.groq.com — free, no credit card
#   OPENROUTER_API_KEY  openrouter.ai — free tier is 50 req/day without credit
#   TG_WEBHOOK_SECRET   any long random string; shared with Telegram at
#                       setWebhook time and returned as the
#                       X-Telegram-Bot-Api-Secret-Token header. This is the
#                       primary proof that a /tg/webhook call is really from
#                       Telegram, so treat it like any other secret.
